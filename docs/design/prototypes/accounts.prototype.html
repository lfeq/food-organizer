<title>Member row boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   THROWAWAY PROTOTYPE — issue #85 on map #31. Not production code.

   TWO questions, one screen, so TWO switcher groups in the bar:

     ROWS   (A-D)  what carries a member's three actions at 390px,
                   and whether the table survives at 900px.
     BELOW  (S1-3) where the instance-settings and export sections go.

   They are independent: any row board composes with any below option.

   Drawn from docs/design/visual-system.md, not from the mockup — the
   mockup file the spec names as its source of truth IS NOT IN THIS
   REPO (never committed, on no branch), so every `1k` claim in the
   ticket is taken on trust and the two mono explainer blocks are
   drawn as a SLOT, not as words.

   Standing decisions honoured below:
     - accounts is DARK territory; no green outside navigation (#84);
     - a surface that contains a control is not itself a control (#65);
     - /accounts lights `Mas` in the tab bar (spec, Tab bar);
     - list block is full-bleed, rows inset 16px (spec, Cards).

   Copy stands in for i18n keys (ADR-0001). Spanish first: the
   household reads Spanish, and Spanish is where these rows break.
   ------------------------------------------------------------------ */

/* --- canvas chrome: the viewer's furniture, NOT the product --- */
*{box-sizing:border-box}
body{margin:0;background:#eae7e0;font-family:'IBM Plex Sans',system-ui,sans-serif;padding:0 20px 80px;color:#191817}
.wrap{max-width:1400px;margin:0 auto}
.canvas-head{padding:26px 0 18px}
.canvas-head h1{font:700 21px/1.25 'IBM Plex Sans',sans-serif;margin:0 0 10px;text-wrap:balance}
.canvas-head p{font:400 13px/1.65 'IBM Plex Sans',sans-serif;color:#57534e;margin:0 0 10px;max-width:70ch}
a{color:#2d6a4d}
code{font-family:'IBM Plex Mono',monospace;background:rgba(25,24,23,.07);padding:1px 5px;border-radius:3px;font-size:.92em}

.bar{position:sticky;top:0;z-index:50;background:#191817;margin:0 -20px 24px;padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bargroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar .lbl{font:600 9px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,254,251,.55);margin-right:2px}
.bar button{font:500 12px 'IBM Plex Sans',sans-serif;background:transparent;color:rgba(255,254,251,.72);border:1px solid rgba(255,254,251,.25);border-radius:999px;padding:6px 13px;cursor:pointer}
.bar button:hover{border-color:rgba(255,254,251,.6);color:#fffefb}
.bar button:focus-visible{outline:2px solid #fffefb;outline-offset:2px}
.bar button.on{background:#fffefb;color:#191817;border-color:#fffefb;font-weight:600}

section.blk{margin:0 0 40px}
h2.blkh{font:600 10px/1.2 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#57534e;margin:0 0 8px}
p.blksub{font:400 13px/1.6 'IBM Plex Sans',sans-serif;color:#57534e;margin:0 0 16px;max-width:70ch}
.note{background:rgba(25,24,23,.05);border-left:2px solid #191817;padding:12px 14px;margin:0 0 18px;max-width:74ch;font:400 12.5px/1.65 'IBM Plex Sans',sans-serif;color:#3f3b37}
.note b{color:#191817}
.note+.note{margin-top:-6px}
.decided{background:#191817;color:#fffefb;padding:12px 14px;border-radius:8px;margin:0 0 18px;max-width:74ch;font:400 12.5px/1.65 'IBM Plex Sans',sans-serif}
.decided b{color:#fffefb}
.decided code{background:rgba(255,254,251,.16);color:#fffefb}
.found{background:#fffefb;border:1px solid rgba(25,24,23,.14);border-radius:10px;padding:4px 18px 6px;max-width:78ch}
.found li{font:400 12.5px/1.7 'IBM Plex Sans',sans-serif;color:#3f3b37;margin:9px 0}
.found b{color:#191817}

.blabel{font:400 12px/1.6 'IBM Plex Sans',sans-serif;color:#57534e;max-width:74ch;margin:0 0 14px}
.blabel .bname{display:block;font:600 15px/1.3 'IBM Plex Sans',sans-serif;color:#191817;margin-bottom:6px}
.cost{display:block;margin-top:7px;color:#8a2323}
.pair{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.state{font:600 9px/1.2 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#78716c;margin:0 0 6px}
.frame{width:390px;max-width:100%;background:var(--ground-page);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.14);display:flex;flex-direction:column;min-height:560px}
.dwrap{overflow-x:auto;padding-bottom:6px;max-width:100%}
.dframe{width:900px;background:var(--ground-page);border-radius:12px;overflow:hidden;display:flex;box-shadow:0 1px 3px rgba(0,0,0,.14);min-height:520px}

/* --- product tokens: docs/design/visual-system.md --- */
:root{
  --ground-page:#f6f4ef; --ground-surface:#fffefb; --ground-inverse:#191817;
  --ground-chip:rgba(25,24,23,.07); --ground-inverse-soft:rgba(25,24,23,.06);
  --ground-sunken:rgba(25,24,23,.05);
  --ink:#191817; --ink-secondary:#6d6862; --ink-muted:#6d6862;
  --ink-faint:rgba(25,24,23,.3); --ink-on-inverse:#fffefb;
  --ink-on-inverse-muted:rgba(255,254,251,.62); --ink-on-inverse-faint:rgba(255,254,251,.55);
  --accent:#2d6a4d; --ink-on-accent:#fffefb;
  --danger:#8a2323; --rule-danger:rgba(138,35,35,.3);
  --rule:rgba(25,24,23,.1); --rule-inset:rgba(25,24,23,.07);
  --rule-control:rgba(25,24,23,.18); --rule-strong:#191817;
  --scrim:rgba(25,24,23,.45);
  --radius-tag:3px; --radius-control:8px; --radius-card:10px; --radius-sheet:16px; --radius-pill:999px;
}
/* type roles, named as the spec names them */
.t-title{font:700 22px/1.15 'IBM Plex Sans',sans-serif;color:var(--ink)}
.t-title-d{font:700 26px/1.1 'IBM Plex Sans',sans-serif;color:var(--ink)}
.t-title-sheet{font:700 16px/1.2 'IBM Plex Sans',sans-serif;color:var(--ink)}
.t-item{font:500 15px/1.3 'IBM Plex Sans',sans-serif;color:var(--ink)}
.t-meta{font:400 11px/1.5 'IBM Plex Mono',monospace;color:var(--ink-muted)}
.t-note{font:400 11px/1.6 'IBM Plex Mono',monospace;color:var(--ink-muted)}
.t-eyebrow{font:600 9px/1.2 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
.t-body-sm{font:400 13px/1.5 'IBM Plex Sans',sans-serif;color:var(--ink-secondary)}
.t-tab{font:400 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}

.badge{display:inline-block;background:var(--ground-inverse);color:var(--ink-on-inverse);border-radius:var(--radius-tag);padding:2px 6px;font:600 9px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;vertical-align:middle}
.tag{display:inline-block;border:1px solid var(--rule-control);color:var(--ink-muted);border-radius:var(--radius-tag);padding:2px 6px;font:500 9px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;vertical-align:middle}

.hdr{padding:16px 16px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hdr-d{padding:26px 30px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--rule)}
.btn{font:600 12px/1 'IBM Plex Sans',sans-serif;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-dark{background:var(--ground-inverse);color:var(--ink-on-inverse);border-radius:var(--radius-pill);padding:12px 16px}
.btn-dark-form{background:var(--ground-inverse);color:var(--ink-on-inverse);border-radius:var(--radius-control);padding:12px 16px}
.btn-sec{background:var(--ground-surface);color:var(--ink);border:1px solid var(--rule-control);border-radius:var(--radius-control);padding:12px 16px;font-weight:500}
.btn-out-sm{background:transparent;color:var(--ink);border:1px solid var(--rule-control);border-radius:var(--radius-control);padding:6px 12px;font:600 11px/1 'IBM Plex Sans',sans-serif;cursor:pointer;white-space:nowrap}
.btn-out-sm.dgr{color:var(--danger);border-color:var(--rule-danger)}
.btn-out-sm[disabled]{color:var(--ink-muted);border-color:var(--rule-inset);cursor:not-allowed}
.btn-block{width:100%;justify-content:center;border-radius:var(--radius-control);padding:16px 0;font-size:13px}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--rule-danger);border-radius:var(--radius-control);padding:16px;font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer;width:100%;text-align:center}

/* the list block: full bleed, contents inset 16px */
.list{background:var(--ground-surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.item{padding:12px 16px;border-bottom:1px solid var(--rule-inset);display:flex;justify-content:space-between;align-items:center;gap:12px}
.item:last-child{border-bottom:none}
.item-main{min-width:0;display:flex;flex-direction:column;gap:5px}
.item-tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dots{font:400 16px/1 'IBM Plex Sans',sans-serif;color:var(--ink-secondary);background:none;border:none;cursor:pointer;padding:12px 6px;margin:-12px -6px}
.chev{color:var(--ink-faint);font-size:14px}
/* row-as-control: #65's list-row treatment, inset rule + sunken, not a shadow */
.item.rowctl{cursor:pointer}
.item.rowctl.hov{box-shadow:inset 2px 0 0 var(--rule-strong);background:var(--ground-sunken)}
.you{font:400 11px/1.5 'IBM Plex Mono',monospace;color:var(--ink-muted);margin-left:5px}
.actrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}

.sect{padding:22px 16px 6px}
.sect-d{padding:22px 30px 6px}
.sect h3{margin:0 0 12px}
.field-lbl{font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px}
.field{background:var(--ground-surface);border:1px solid var(--rule-control);border-radius:var(--radius-control);padding:12px;font:400 14px 'IBM Plex Sans',sans-serif;color:var(--ink)}
.field.lock{border-style:none;background:none;padding:12px 0;color:var(--ink-secondary)}
.fgroup{margin-bottom:14px}
.help{font:400 11px/1.5 'IBM Plex Mono',monospace;color:var(--ink-muted);margin-top:6px}
.sunken{background:var(--ground-sunken);border-radius:var(--radius-card);padding:12px 16px;margin:16px}
.sunken-d{margin:16px 30px}
.seg{display:flex;gap:6px;padding:0 16px 14px}
.seg-d{padding:0 30px 16px}
.seg div{flex:1;text-align:center;padding:11px 0;border:1px solid var(--rule-control);border-radius:var(--radius-control);font:500 12px 'IBM Plex Sans',sans-serif;color:var(--ink-secondary);cursor:pointer}
.seg div.on{border-color:var(--rule-strong);background:var(--ground-inverse-soft);color:var(--ink);font-weight:600}

.tabbar{display:flex;background:var(--ground-surface);border-top:1px solid var(--rule);margin-top:auto}
.tabbar div{flex:1;text-align:center;padding:12px 0}
.tabbar div.on{border-top:2px solid var(--accent);margin-top:-1px;color:var(--ink);font-weight:600}
.sidebar{width:184px;background:var(--ground-inverse);padding:24px 16px;display:flex;flex-direction:column;gap:24px;flex:0 0 184px}
.brand{font:600 13px 'IBM Plex Sans',sans-serif;color:var(--ink-on-inverse)}
.brand span{display:block;font:400 11px/1.5 'IBM Plex Mono',monospace;color:var(--ink-on-inverse-faint);margin-top:2px}
.navitem{padding:8px 12px;border-radius:var(--radius-control);font:400 12px 'IBM Plex Sans',sans-serif;color:var(--ink-on-inverse-muted)}
.navitem.on{background:rgba(255,254,251,.12);color:var(--ink-on-inverse);font-weight:600}
.navitem.new{color:#fffefb;outline:1px dashed rgba(255,254,251,.45)}
.dcol{flex:1;min-width:0;display:flex;flex-direction:column}
.dim{padding:14px 0 0;text-align:center;font:400 11px/1.5 'IBM Plex Mono',monospace;color:rgba(255,254,251,.55)}

/* the table, board D only */
table.mt{width:100%;border-collapse:collapse;background:var(--ground-surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
table.mt th{text-align:left;padding:10px 16px;border-bottom:1px solid var(--rule);font:600 9px/1.2 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
table.mt td{padding:12px 16px;border-bottom:1px solid var(--rule-inset);vertical-align:middle}
table.mt tr:last-child td{border-bottom:none}
table.mt td.acts{text-align:right;white-space:nowrap}
table.mt td.acts .actrow{justify-content:flex-end;flex-wrap:nowrap;margin:0}

/* sheets */
.scrimwrap{position:relative;flex:1;display:flex;flex-direction:column}
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end}
.sheet{background:var(--ground-surface);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px;width:100%}
.sheet-hd{display:flex;justify-content:space-between;align-items:center}
.dismiss{font:400 11px 'IBM Plex Mono',monospace;color:var(--ink-muted);background:none;border:none;cursor:pointer;padding:12px 0;margin:-12px 0}
.arow{padding:15px 4px;border-bottom:1px solid var(--rule-inset);font:500 14px 'IBM Plex Sans',sans-serif;color:var(--ink);cursor:pointer}
.arow:last-child{border-bottom:none}
.arow.danger{color:var(--danger)}
.sheetmeta{font:400 11px/1.6 'IBM Plex Mono',monospace;color:var(--ink-muted);border-top:1px solid var(--rule);padding-top:13px}
.sheetmeta .absent{color:#8a2323}
.stack{display:flex;flex-direction:column;gap:8px}
</style>

<div class="bar">
  <div class="bargroup"><span class="lbl">Idioma</span>
    <button data-lang="es" class="on">ES</button><button data-lang="en">EN</button></div>
  <div class="bargroup"><span class="lbl" id="lblRows">Filas</span>
    <button data-board="A" class="on">A</button><button data-board="B">B</button>
    <button data-board="C">C</button><button data-board="D">D</button></div>
  <div class="bargroup"><span class="lbl" id="lblBelow">Debajo</span>
    <button data-below="S1" class="on">S1</button><button data-below="S2">S2</button>
    <button data-below="S3">S3</button></div>
  <div class="bargroup"><span class="lbl" id="lblLast">Estado</span>
    <button data-last="1" id="lastBtn">&Uacute;ltimo admin</button></div>
</div>

<div class="wrap">
  <div class="canvas-head">
    <h1 id="h1"></h1>
    <p id="intro1"></p>
    <p id="intro2"></p>
  </div>

  <section class="blk">
    <h2 class="blkh" id="qh"></h2>
    <div class="note" id="q1"></div>
    <div class="note" id="q2"></div>
    <div class="decided" id="qd"></div>
  </section>

  <section class="blk">
    <h2 class="blkh" id="boardh"></h2>
    <p class="blksub" id="boardsub"></p>
    <div class="blabel" id="boardlabel"></div>
    <div class="pair" id="board"></div>
  </section>

  <section class="blk">
    <h2 class="blkh" id="belowh"></h2>
    <div class="blabel" id="belowlabel"></div>
    <div class="pair" id="below"></div>
  </section>

  <section class="blk">
    <h2 class="blkh" id="foundh"></h2>
    <p class="blksub" id="foundsub"></p>
    <ul class="found" id="found"></ul>
  </section>
</div>

<script>
let L = 1;            /* 0 = EN, 1 = ES — Spanish first: Spanish is where these rows break */
let BOARD = 'A';
let BELOW = 'S1';
let LAST = false;     /* true = mariana is the only admin left */

/* ---------- product copy (stands in for i18n keys, ADR-0001) ---------- */
const T = {
  accounts:['Accounts','Integrantes'],
  addMember:['+ Add member','+ Agregar miembro'],
  you:['(you)','(t&uacute;)'],
  admin:['Admin','Admin'], member:['Member','Miembro'],
  mustChange:['Must change password','Debe cambiar contrase&ntilde;a'],
  resetPw:['Reset password','Restablecer contrase&ntilde;a'],
  makeAdmin:['Make admin','Hacer administrador'],
  makeMember:['Make member','Hacer miembro'],
  remove:['Remove','Eliminar'],
  lastAdmin:['Last admin','&Uacute;ltimo administrador'],
  count:['4 members &middot; 2 admins','4 integrantes &middot; 2 administradores'],
  count1:['4 members &middot; 1 admin','4 integrantes &middot; 1 administrador'],
  settings:['Instance settings','Configuraci&oacute;n'],
  weekStart:['Week start','Inicio de semana'],
  sunday:['Sunday','Domingo'],
  locked:['locked &mdash; a plan already exists','bloqueado &mdash; ya existe un plan'],
  timezone:['Timezone','Zona horaria'],
  displayName:['Display name','Nombre del hogar'],
  saveSettings:['Save settings','Guardar configuraci&oacute;n'],
  exportTitle:['Export data','Exportar datos'],
  exportDesc:['A machine-readable backup of the catalogue, plans, members and settings. Password hashes are never included.','Una copia de seguridad legible por m&aacute;quina del cat&aacute;logo, los planes, los integrantes y la configuraci&oacute;n. Las contrase&ntilde;as nunca se incluyen.'],
  exportBtn:['Download my data','Descargar mis datos'],
  adminNote:['Admins add members, reset passwords, remove members, and grant the admin role — including their own. An instance never has fewer than one admin.','Los administradores agregan integrantes, restablecen contrase&ntilde;as, eliminan integrantes y otorgan el rol de administrador — incluido el propio. Una instancia nunca tiene menos de un administrador.'],
  thisWeek:['This week','Esta semana'], dishes:['Dishes','Platillos'],
  history:['History','Historial'], plan:['Plan','Plan'], more:['More','M&aacute;s'],
  close:['Close','Cerrar'], cancel:['Cancel','Cancelar'],
  role:['Role','Rol'], status:['Status','Estado'], memberCol:['Member','Integrante'],
  joined:['joined 12 aug 2026','se uni&oacute; 12 ago 2026'],
  noLastSeen:['no last-seen data exists','no existe dato de ultimo acceso'],
  membersView:['Members','Integrantes'],
};
const tt = k => T[k][L];

/* ---------- the household ---------- */
const ALL = [
  {n:'mariana', role:'admin',  you:true,  must:false},
  {n:'lorenzo', role:'admin',  you:false, must:false},
  {n:'sofia',   role:'member', you:false, must:true},
  {n:'abuela',  role:'member', you:false, must:false},
];
/* LAST demotes lorenzo, leaving mariana the only admin — the state the
   route guards for and no board can draw with two admins on screen. */
const members = () => LAST ? ALL.map(m=>m.n==='lorenzo'?{...m, role:'member'}:m) : ALL;

/* ---------- pieces ---------- */
/* Role: admins carry the filled badge, everyone else carries nothing —
   absence means member. Two roles, so the second tag would be noise on
   most rows. Status is an outlined tag: a state the member is in. */
const tags = m => (m.role==='admin'||m.must) ? `<div class="item-tags">`
  + (m.role==='admin' ? `<span class="badge">${tt('admin')}</span>` : ``)
  + (m.must ? `<span class="tag">${tt('mustChange')}</span>` : ``)
  + `</div>` : '';

const nm = m => `<span class="t-item">${m.n}${m.you?`<span class="you">${tt('you')}</span>`:''}</span>`;

/* the three actions a row carries, in the order the route builds them */
function acts(m, small){
  const roleLbl = m.role==='admin' ? tt('makeMember') : tt('makeAdmin');
  const last = m.role==='admin' && members().filter(x=>x.role==='admin').length<=1;
  return [
    {k:'reset', lbl:tt('resetPw')},
    {k:'role',  lbl:last?tt('lastAdmin'):roleLbl, dis:last},
    {k:'del',   lbl:tt('remove'), dgr:true},
  ];
}

const hdrPhone = () => `<div class="hdr"><div>
    <div class="t-title">${tt('accounts')}</div>
    <div class="t-meta" style="margin-top:4px">${LAST?tt('count1'):tt('count')}</div>
  </div><button class="btn btn-dark">${tt('addMember')}</button></div>`;

const hdrDesk = () => `<div class="hdr-d"><div>
    <div class="t-title-d">${tt('accounts')}</div>
    <div class="t-meta" style="margin-top:5px">${LAST?tt('count1'):tt('count')}</div>
  </div><button class="btn btn-dark">${tt('addMember')}</button></div>`;

const tabbar = () => `<div class="tabbar">
  <div class="t-tab">${tt('plan')}</div><div class="t-tab">${tt('dishes')}</div>
  <div class="t-tab">${tt('history')}</div><div class="t-tab on">${tt('more')}</div></div>`;

const sidebar = (fifth) => `<div class="sidebar">
  <div class="brand">Casa Hern&aacute;ndez<span>self-hosted</span></div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <div class="navitem">${tt('thisWeek')}</div><div class="navitem">${tt('dishes')}</div>
    <div class="navitem">${tt('history')}</div><div class="navitem on">${tt('accounts')}</div>
    ${fifth?`<div class="navitem new">${tt('settings')}</div>`:''}
  </div>
  <div style="margin-top:auto"><div class="dim" style="text-align:left;padding:0">mariana &middot; admin<br>EN / ES &middot; ${L?'Cerrar sesi&oacute;n':'Sign out'}</div></div>
</div>`;

/* ---------- the four row boards ---------- */
function rows(board, wide){
  return members().map(m=>{
    const a = acts(m);
    if(board==='A') return `<div class="item">
        <div class="item-main">${nm(m)}${tags(m)}</div>
        <button class="dots" aria-label="${m.n}">&#183;&#183;&#183;</button></div>`;
    if(board==='B') return `<div class="item rowctl${m.n==='sofia'?' hov':''}">
        <div class="item-main">${nm(m)}${tags(m)}</div>
        <span class="chev">&rarr;</span></div>`;
    if(board==='C') return `<div class="item" style="flex-direction:column;align-items:stretch">
        <div class="item-main">${nm(m)}${tags(m)}</div>
        <div class="actrow">${a.map(x=>`<button class="btn-out-sm${x.dgr?' dgr':''}"${x.dis?' disabled':''}>${x.lbl}</button>`).join('')}</div></div>`;
    /* D on the phone is A */
    return `<div class="item">
        <div class="item-main">${nm(m)}${tags(m)}</div>
        <button class="dots" aria-label="${m.n}">&#183;&#183;&#183;</button></div>`;
  }).join('');
}

function table(){
  return `<table class="mt"><thead><tr>
      <th>${tt('memberCol')}</th><th>${tt('role')}</th><th>${tt('status')}</th><th></th>
    </tr></thead><tbody>` + members().map(m=>{
      const a = acts(m);
      return `<tr>
        <td>${nm(m)}</td>
        <td>${m.role==='admin'?`<span class="badge">${tt('admin')}</span>`:`<span class="t-meta">&mdash;</span>`}</td>
        <td>${m.must?`<span class="tag">${tt('mustChange')}</span>`:''}</td>
        <td class="acts"><div class="actrow">${a.map(x=>`<button class="btn-out-sm${x.dgr?' dgr':''}"${x.dis?' disabled':''}>${x.lbl}</button>`).join('')}</div></td>
      </tr>`;
    }).join('') + `</tbody></table>`;
}

/* ---------- the below-the-list region ---------- */
function belowRegion(wide){
  const p = wide?'-d':'';
  const sunken = `<div class="sunken ${wide?'sunken-d':''}"><div class="t-note">${tt('adminNote')}</div></div>`;
  if(BELOW==='S3') return sunken;                    /* settings left the screen entirely */
  if(BELOW==='S2') return sunken;                    /* settings behind the second segment */
  return sunken + `
    <div class="sect${p}">
      <div class="t-eyebrow" style="margin-bottom:12px">${tt('settings')}</div>
      <div class="fgroup"><div class="field-lbl">${tt('weekStart')}</div>
        <div class="field lock">${tt('sunday')} <span class="t-meta">(${tt('locked')})</span></div></div>
      <div class="fgroup"><div class="field-lbl">${tt('timezone')}</div>
        <div class="field">America/Mexico_City</div></div>
      <div class="fgroup"><div class="field-lbl">${tt('displayName')}</div>
        <div class="field">Casa Hern&aacute;ndez</div></div>
      <button class="btn btn-dark-form">${tt('saveSettings')}</button>
    </div>
    <div class="sect${p}" style="padding-bottom:24px">
      <div class="t-eyebrow" style="margin-bottom:10px">${tt('exportTitle')}</div>
      <div class="t-body-sm" style="margin-bottom:12px">${tt('exportDesc')}</div>
      <button class="btn btn-sec">${tt('exportBtn')}</button>
    </div>`;
}

const segStrip = wide => BELOW==='S2'
  ? `<div class="seg ${wide?'seg-d':''}"><div class="on">${tt('membersView')}</div><div>${tt('settings')}</div></div>`
  : '';

/* ---------- frames ---------- */
function phone(){
  return `<div><div class="state">390 &times; phone</div><div class="frame">
    ${hdrPhone()}${segStrip(false)}
    <div class="list">${rows(BOARD,false)}</div>
    ${belowRegion(false)}
    ${tabbar()}
  </div></div>`;
}

function desktop(){
  const body = BOARD==='D' ? table() : `<div class="list">${rows(BOARD,true)}</div>`;
  return `<div class="dwrap"><div class="state">900 &times; desktop</div><div class="dframe">
    ${sidebar(BELOW==='S3')}
    <div class="dcol">${hdrDesk()}${segStrip(true)}${body}${belowRegion(true)}</div>
  </div></div>`;
}

/* the sheet each board opens, drawn over a dimmed screen */
function sheetFrame(){
  const m = members()[2];  /* sofia: a member who must change her password */
  const a = acts(m);
  let inner;
  if(BOARD==='A'||BOARD==='D'){
    inner = `<div class="sheet">
      <div class="sheet-hd"><span class="t-title-sheet">${m.n}</span>
        <button class="dismiss">${tt('close')}</button></div>
      <div>${a.map(x=>`<div class="arow${x.dgr?' danger':''}">${x.lbl}</div>`).join('')}</div>
    </div>`;
  } else if(BOARD==='B'){
    inner = `<div class="sheet">
      <div class="sheet-hd"><span class="t-title-sheet">${m.n}</span>
        <button class="dismiss">${tt('close')}</button></div>
      <div class="item-tags">${m.role==='admin'?`<span class="badge">${tt('admin')}</span>`:''}${m.must?`<span class="tag">${tt('mustChange')}</span>`:''}</div>
      <div class="stack">
        <button class="btn btn-sec btn-block">${a[0].lbl}</button>
        <button class="btn btn-sec btn-block">${a[1].lbl}</button>
        <button class="btn-danger">${a[2].lbl}</button>
      </div>
      <div class="sheetmeta">${tt('joined')}<br><span class="absent">${tt('noLastSeen')}</span></div>
    </div>`;
  } else {
    inner = `<div class="sheet">
      <div class="sheet-hd"><span class="t-title-sheet">${tt('remove')} &mdash; ${m.n}</span>
        <button class="dismiss">${tt('cancel')}</button></div>
      <div class="t-body-sm">${L?'Se eliminar&aacute; su cuenta. Sus platillos permanecen en el cat&aacute;logo.':'Their account is deleted. Their dishes stay in the catalogue.'}</div>
      <button class="btn-danger">${tt('remove')}</button>
    </div>`;
  }
  const label = (BOARD==='C')
    ? (L?'C no tiene hoja de acciones — solo la confirmaci&oacute;n destructiva':'C has no action sheet — only the destructive confirm')
    : (L?'la hoja que abre la fila':'the sheet the row opens');
  return `<div><div class="state">${label}</div><div class="frame">
    ${hdrPhone()}${segStrip(false)}
    <div class="scrimwrap">
      <div class="list">${rows(BOARD,false)}</div>
      <div class="scrim">${inner}</div>
    </div>
    ${tabbar()}
  </div></div>`;
}

  document.getElementById('boardlabel').innerHTML =
    `<span class="bname">${b.name[L]}</span>${b.body[L]}<span class="cost">${b.cost[L]}</span>`;
  document.getElementById('board').innerHTML = phone() + sheetFrame() + desktop();

  const s = BELOWS[BELOW];
  document.getElementById('belowlabel').innerHTML =
    `<span class="bname">${s.name[L]}</span>${s.body[L]}<span class="cost">${s.cost[L]}</span>`;
  document.getElementById('below').innerHTML = BELOW==='S3'
    ? `<div><div class="state">${L?'la hoja M&aacute;s gana una entrada':'the More sheet gains an entry'}</div>
        <div class="frame" style="min-height:400px">
          ${hdrPhone()}
          <div class="scrimwrap">
            <div class="list">${rows(BOARD,false)}</div>
            <div class="scrim"><div class="sheet">
              <div class="sheet-hd"><span class="t-title-sheet">${tt('more')}</span><button class="dismiss">${tt('close')}</button></div>
              <div><div class="arow">${tt('accounts')}</div><div class="arow" style="outline:1px dashed var(--rule-control);outline-offset:-4px">${tt('settings')}</div></div>
              <div class="sheetmeta">mariana &middot; admin<br>EN / ES &middot; ${L?'Cerrar sesi&oacute;n':'Sign out'}</div>
            </div></div>
          </div>
          ${tabbar()}
        </div></div>`
    : `<div class="t-body-sm" style="max-width:70ch">${L?'Se dibuja dentro de los marcos de arriba — baja hasta el final del tel&eacute;fono y del escritorio.':'Drawn inside the frames above — scroll to the bottom of the phone and the desktop.'}</div>`;

  document.getElementById('found').innerHTML = FOUND.map(f=>`<li>${f[L]}</li>`).join('');

  document.querySelectorAll('[data-lang]').forEach(el=>el.classList.toggle('on', (el.dataset.lang==='es')===(L===1)));
  document.querySelectorAll('[data-board]').forEach(el=>el.classList.toggle('on', el.dataset.board===BOARD));
  document.querySelectorAll('[data-below]').forEach(el=>el.classList.toggle('on', el.dataset.below===BELOW));
  const lb = document.getElementById('lastBtn');
  lb.classList.toggle('on', LAST); lb.innerHTML = L?'&Uacute;ltimo admin':'Last admin';
  document.getElementById('lblLast').textContent = L?'Estado':'State';
}

document.querySelector('.bar').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.lang)  L = b.dataset.lang==='es' ? 1 : 0;
  if(b.dataset.board) BOARD = b.dataset.board;
  if(b.dataset.below) BELOW = b.dataset.below;
  if(b.dataset.last)  LAST = !LAST;
  render();
});
render();
</script>
