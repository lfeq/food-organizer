<title>Dish flow boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   THROWAWAY PROTOTYPE — issue #84 on map #31. Not production code.

   ONE BOARD AT A TIME, picked from the sticky bar at the top. The
   first version of this file stacked all four boards down one very
   tall page and only the first one was ever found, which is the bug
   this rewrite fixes.

   Four catalogue boards disagree about HOW THE CATALOGUE IS ORGANISED
   and WHERE A ROW'S ACTIONS LIVE. The "Filter or group?" block above
   the switcher is always on screen, because that single question also
   decides the desktop layout.

   Settled so far by the household:
     - the add/edit form is a Sheet on the phone and a centred panel
       on the desktop (S2);
     - the selected course segment is DARK, not green.
   Both are drawn that way below.

   Values from docs/design/visual-system.md. Copy stands in for i18n
   keys (ADR-0001); Spanish uses Guarnicion / Guarniciones per #36,
   which src/i18n.ts has not taken yet.
   ------------------------------------------------------------------ */

/* --- canvas chrome: the viewer's furniture, NOT the product --- */
*{box-sizing:border-box}
body{margin:0;background:#eae7e0;font-family:'IBM Plex Sans',system-ui,sans-serif;padding:0 20px 80px;color:#191817}
.wrap{max-width:1400px;margin:0 auto}
.canvas-head{padding:26px 0 18px}
.canvas-head h1{font:700 21px/1.25 'IBM Plex Sans',sans-serif;margin:0 0 10px;text-wrap:balance}
.canvas-head p{font:400 13px/1.65 'IBM Plex Sans',sans-serif;color:#57534e;margin:0 0 10px;max-width:70ch}
a{color:#2d6a4d}
code{font-family:'IBM Plex Mono',monospace;background:rgba(25,24,23,.07);padding:1px 5px;border-radius:3px;font-size:.92em}

.bar{position:sticky;top:0;z-index:50;background:#191817;margin:0 -20px 24px;padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bargroup{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bar .lbl{font:600 9px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,254,251,.55);margin-right:2px}
.bar button{font:500 12px 'IBM Plex Sans',sans-serif;background:transparent;color:rgba(255,254,251,.72);border:1px solid rgba(255,254,251,.25);border-radius:999px;padding:6px 13px;cursor:pointer}
.bar button:hover{border-color:rgba(255,254,251,.6);color:#fffefb}
.bar button:focus-visible{outline:2px solid #fffefb;outline-offset:2px}
.bar button.on{background:#fffefb;color:#191817;border-color:#fffefb;font-weight:600}

section.blk{margin:0 0 40px}
h2.blkh{font:600 10px/1.2 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#57534e;margin:0 0 8px}
p.blksub{font:400 13px/1.6 'IBM Plex Sans',sans-serif;color:#57534e;margin:0 0 16px;max-width:70ch}
.note{background:rgba(25,24,23,.05);border-left:2px solid #191817;padding:12px 14px;margin:0 0 18px;max-width:70ch;font:400 12.5px/1.65 'IBM Plex Sans',sans-serif;color:#3f3b37}
.note b{color:#191817}
.decided{background:#191817;color:#fffefb;padding:12px 14px;border-radius:8px;margin:0 0 18px;max-width:70ch;font:400 12.5px/1.65 'IBM Plex Sans',sans-serif}
.decided b{color:#fffefb}
.decided code{background:rgba(255,254,251,.16);color:#fffefb}

.blabel{font:400 12px/1.6 'IBM Plex Sans',sans-serif;color:#57534e;max-width:72ch;margin:0 0 14px}
.blabel .bname{display:block;font:600 15px/1.3 'IBM Plex Sans',sans-serif;color:#191817;margin-bottom:6px}
.cost{display:block;margin-top:7px;color:#8a2323}
.pair{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.state{font:600 9px/1.2 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#78716c;margin:0 0 6px}
.frame{width:390px;max-width:100%;background:var(--ground-page);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.14);display:flex;flex-direction:column;min-height:540px}
.dwrap{overflow-x:auto;padding-bottom:6px;max-width:100%}
.dframe{width:900px;background:var(--ground-page);border-radius:12px;overflow:hidden;display:flex;box-shadow:0 1px 3px rgba(0,0,0,.14);min-height:460px}

/* --- product tokens: docs/design/visual-system.md --- */
:root{
  --ground-page:#f6f4ef; --ground-surface:#fffefb; --ground-inverse:#191817;
  --ground-chip:rgba(25,24,23,.07); --ground-inverse-soft:rgba(25,24,23,.06);
  --ink:#191817; --ink-secondary:#6d6862; --ink-muted:#6d6862;
  --ink-faint:rgba(25,24,23,.3); --ink-on-inverse:#fffefb;
  --ink-on-inverse-muted:rgba(255,254,251,.62); --ink-on-inverse-faint:rgba(255,254,251,.55);
  --accent:#2d6a4d; --ink-on-accent:#fffefb;
  --danger:#8a2323; --rule-danger:rgba(138,35,35,.3);
  --rule:rgba(25,24,23,.1); --rule-inset:rgba(25,24,23,.07);
  --rule-control:rgba(25,24,23,.18); --rule-strong:#191817;
  --scrim:rgba(25,24,23,.45);
  --radius-tag:3px; --radius-control:8px; --radius-card:10px; --radius-sheet:14px; --radius-pill:999px;
}
.t-title{font:700 20px/1.1 'IBM Plex Sans',sans-serif;color:var(--ink)}
.t-title-d{font:700 26px/1.1 'IBM Plex Sans',sans-serif;color:var(--ink)}
.t-title-sheet{font:700 16px/1.2 'IBM Plex Sans',sans-serif;color:var(--ink)}
.t-meta{font:400 11px/1.5 'IBM Plex Mono',monospace;color:var(--ink-muted)}
.t-meta-sm{font:400 10.5px/1.4 'IBM Plex Mono',monospace;color:var(--ink-muted)}
.t-eyebrow{font:600 9px/1.2 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
.t-dish{font:500 14.5px/1.25 'IBM Plex Sans',sans-serif;color:var(--ink)}
.t-tab{font:400 10px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}

.hdr{padding:16px 16px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hdr-d{padding:26px 30px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--rule)}
.btn{font:600 12px/1 'IBM Plex Sans',sans-serif;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-dark{background:var(--ground-inverse);color:var(--ink-on-inverse);border-radius:var(--radius-pill);padding:10px 15px}
.btn-block{width:100%;justify-content:center;border-radius:var(--radius-control);padding:14px 0;font-size:13px}
.btn-danger-outline{background:transparent;color:var(--danger);border:1px solid var(--rule-danger);border-radius:var(--radius-control);padding:14px 16px;font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer}
.chips{padding:0 16px;display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;padding:7px 11px;border-radius:var(--radius-pill);background:var(--ground-chip);color:var(--ink-secondary);white-space:nowrap;border:none;cursor:pointer}
.chip.on{background:var(--ground-inverse);color:var(--ink-on-inverse);font-weight:600}
.list{background:var(--ground-surface);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.item{padding:13px 16px;border-bottom:1px solid var(--rule-inset);display:flex;justify-content:space-between;align-items:center;gap:12px}
.item:last-child{border-bottom:none}
.item-main{min-width:0}
.dots{font:400 16px/1 'IBM Plex Sans',sans-serif;color:var(--ink-secondary);background:none;border:none;cursor:pointer;padding:11px 6px;margin:-11px -6px}
.rowlink{font:500 12px/1 'IBM Plex Sans',sans-serif;color:var(--ink);background:none;border:none;cursor:pointer;padding:11px 0;margin:-11px 0;white-space:nowrap;border-bottom:1px solid var(--rule-control)}
.item-tap{width:100%;text-align:left;background:var(--ground-surface);border:none;border-bottom:1px solid var(--rule-inset);cursor:pointer;padding:0;font:inherit}
.chev{color:var(--ink-faint);font-size:14px}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 7px;background:var(--ground-page)}
.gadd{font:600 9px/1.2 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:none;border:none;cursor:pointer;padding:11px 0;margin:-11px 0;border-bottom:1px solid var(--rule-control)}
.tabbar{display:flex;background:var(--ground-surface);border-top:1px solid var(--rule);margin-top:auto}
.tabbar div{flex:1;text-align:center;padding:12px 0}
.tabbar div.on{border-top:2px solid var(--accent);margin-top:-1px;color:var(--ink);font-weight:600}
.sidebar{width:184px;background:var(--ground-inverse);padding:24px 16px;display:flex;flex-direction:column;gap:24px;flex:0 0 184px}
.brand{font:600 13px 'IBM Plex Sans',sans-serif;color:var(--ink-on-inverse)}
.brand span{display:block;font:400 11px/1.5 'IBM Plex Mono',monospace;color:var(--ink-on-inverse-faint);margin-top:2px}
.navitem{padding:8px 12px;border-radius:var(--radius-control);font:400 12px 'IBM Plex Sans',sans-serif;color:var(--ink-on-inverse-muted)}
.navitem.on{background:rgba(255,254,251,.12);color:var(--ink-on-inverse);font-weight:600}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:18px 30px 24px;align-items:start}
.gcol{background:var(--ground-surface);border:1px solid var(--rule);border-radius:var(--radius-card);overflow:hidden}
.gcol-head{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 9px;border-bottom:1px solid var(--rule-inset)}
.gcol .item{padding:11px 14px}

.dim{padding:14px 0 0;text-align:center;font:400 11px/1.5 'IBM Plex Mono',monospace;color:rgba(255,254,251,.55)}
.sheet{background:var(--ground-surface);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:16px}
.sheet-hd{display:flex;justify-content:space-between;align-items:center}
.dismiss{font:400 12px 'IBM Plex Mono',monospace;color:var(--ink-muted);background:none;border:none;cursor:pointer;padding:11px 0;margin:-11px 0}
.field-lbl{font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:6px}
.field{border:1px solid var(--rule-strong);border-radius:var(--radius-control);padding:12px 13px;font:400 15px 'IBM Plex Sans',sans-serif;color:var(--ink)}
.help{font:400 10.5px 'IBM Plex Mono',monospace;color:var(--ink-muted);margin-top:6px}
.seg{display:flex;gap:6px}
.seg div{flex:1;text-align:center;padding:11px 0;border:1px solid var(--rule-control);border-radius:var(--radius-control);font:500 12px 'IBM Plex Sans',sans-serif;color:var(--ink-secondary)}
/* SETTLED: the selected course segment is DARK, not green. */
.seg div.on{border-color:var(--rule-strong);background:var(--ground-inverse-soft);color:var(--ink);font-weight:600}
.sheetmeta{font:400 11px/1.5 'IBM Plex Mono',monospace;color:var(--ink-muted);border-top:1px solid var(--rule);padding-top:13px}
.sheetmeta .absent{color:#8a2323}
.actions{display:flex;gap:8px}
.actionsheet .arow{padding:15px 4px;border-bottom:1px solid var(--rule-inset);font:500 14px 'IBM Plex Sans',sans-serif;color:var(--ink)}
.actionsheet .arow.danger{color:var(--danger);border-bottom:none}
.panel{background:var(--ground-surface);border:1px solid var(--rule);border-radius:var(--radius-card);padding:22px;width:420px;max-width:100%;display:flex;flex-direction:column;gap:16px}
</style>

<div class="bar">
  <div class="bargroup"><span class="lbl" id="lblLang">Idioma</span>
    <button data-lang="es" class="on">ES</button><button data-lang="en">EN</button></div>
  <div class="bargroup"><span class="lbl" id="lblBoard">Board</span>
    <button data-board="A" class="on">A</button><button data-board="B">B</button>
    <button data-board="C">C</button><button data-board="D">D</button></div>
  <div class="bargroup"><span class="lbl" id="lblWidth">Ancho</span>
    <button data-width="phone" class="on" id="wPhone">Tel&eacute;fono</button>
    <button data-width="desktop" id="wDesk">Escritorio</button></div>
</div>

<div class="wrap">
  <div class="canvas-head">
    <h1 id="h1"></h1>
    <p id="intro1"></p>
    <p id="intro2"></p>
  </div>

  <section class="blk">
    <h2 class="blkh" id="cmph"></h2>
    <p class="blksub" id="cmpsub"></p>
    <div class="note" id="cmpnote"></div>
    <div class="pair" id="compare"></div>
  </section>

  <section class="blk">
    <h2 class="blkh" id="boardh"></h2>
    <p class="blksub" id="boardsub"></p>
    <div class="blabel" id="boardlabel"></div>
    <div class="pair" id="board"></div>
  </section>

  <section class="blk">
    <h2 class="blkh" id="sheeth"></h2>
    <div class="decided" id="sheetdecided"></div>
    <div class="pair" id="sheets"></div>
  </section>
</div>

<script>
let L = 1;            /* 0 = EN, 1 = ES — Spanish first, the household reads Spanish */
let BOARD = 'A';
let WIDTH = 'phone';

/* ---------- product copy (stands in for i18n keys) ---------- */
const T = {
  dishes:['Dishes','Platillos'], total:['9 total &middot; shared catalogue','9 en total &middot; cat&aacute;logo compartido'],
  addDish:['+ Add dish','+ Agregar platillo'], add:['+ Add','+ Agregar'], all:['All','Todos'],
  soups:['Soups','Sopas'], sides:['Sides','Guarniciones'], mains:['Mains','Fuertes'],
  soup:['Soup','Sopa'], side:['Side','Guarnici&oacute;n'], main:['Main','Fuerte'],
  by:['added by mariana','agregado por mariana'], by2:['added by javier','agregado por javier'],
  by3:['added by abuela','agregado por abuela'],
  edit:['Edit','Editar'], del:['Delete','Eliminar'], cancel:['Cancel','Cancelar'],
  editDish:['Edit dish','Editar platillo'], name:['Name','Nombre'], course:['Course','Curso'],
  noTrans:['Names are never translated.','Los nombres nunca se traducen.'],
  save:['Save dish','Guardar platillo'],
  meta1:['added by javier &middot; 12 aug 2026','agregado por javier &middot; 12 ago 2026'],
  meta2:['used 3&times; in the last 8 weeks','usado 3&times; en las &uacute;ltimas 8 semanas'],
  thisWeek:['This week','Esta semana'], history:['History','Historial'],
  accounts:['Accounts','Cuentas'], plan:['Plan','Plan'], more:['More','M&aacute;s'],
  signedIn:['signed in as','sesi&oacute;n de']
};
const t = k => T[k][L];

/* ---------- canvas copy (the viewer's own words) ---------- */
const X = {
  lblLang:['Language','Idioma'], lblBoard:['Board','Board'], lblWidth:['Width','Ancho'],
  wPhone:['Phone','Tel&eacute;fono'], wDesk:['Desktop','Escritorio'],
  h1:['What do the dish catalogue and its add/edit sheet become at both widths?',
      '&iquest;En qu&eacute; se convierten el cat&aacute;logo de platillos y su hoja de agregar/editar en los dos anchos?'],
  intro1:['Issue #84 on map #31. Pick a board in the bar above &mdash; one at a time, phone or desktop.',
          'Issue #84 del mapa #31. Elige un board en la barra de arriba &mdash; uno a la vez, tel&eacute;fono o escritorio.'],
  intro2:['Today the app draws three columns, one per course, with an <b>Edit</b> and a <b>Delete</b> button on every row. The artboard <code>1f</code> draws one list with three chips and a single <code>&middot;&middot;&middot;</code>. Three columns cannot fit a phone, so something has to give.',
          'Hoy la app dibuja tres columnas, una por curso, con un bot&oacute;n <b>Editar</b> y uno de <b>Eliminar</b> en cada rengl&oacute;n. El artboard <code>1f</code> dibuja una sola lista con tres chips y un solo <code>&middot;&middot;&middot;</code>. Tres columnas no caben en un tel&eacute;fono, as&iacute; que algo tiene que ceder.'],

  cmph:['Settled: the chips filter. The question it leaves open: is there an All chip?',
        'Decidido: los chips filtran. La pregunta que eso deja abierta: &iquest;hay un chip Todos?'],
  cmpsub:['Same catalogue of nine dishes in both. Count what is on screen.',
          'El mismo cat&aacute;logo de nueve platillos en los dos. Cuenta lo que est&aacute; en pantalla.'],
  cmpnote:['<b>Filtering is decided</b>, which also settles the desktop: the three columns are gone, because filtering to <i>Soups</i> would leave one column full and two empty. Boards <b>B</b> and <b>C</b> below are out &mdash; they group. The live choice is now <b>A or D</b>, which differ only in where a row&rsquo;s actions live.<br><br>But a filter with three chips has no way back to the whole catalogue. <b>Left:</b> <code>1f</code> exactly &mdash; three chips, one always active, <b>3 of 9 dishes</b> on screen and no way to see all nine. <b>Right:</b> a fourth <code>All 9</code> chip, active by default, so the catalogue opens whole and the courses narrow it.<br><br>The right-hand version costs one more chip on the tightest row in the app &mdash; and in Spanish those chips carry <code>Guarniciones</code>. Tap <b>ES</b> and check that it still fits.',
            '<b>Filtrar ya est&aacute; decidido</b>, y eso resuelve tambi&eacute;n el escritorio: las tres columnas desaparecen, porque filtrar a <i>Sopas</i> dejar&iacute;a una columna llena y dos vac&iacute;as. Los boards <b>B</b> y <b>C</b> de abajo quedan fuera &mdash; agrupan. La elecci&oacute;n viva es <b>A o D</b>, que s&oacute;lo difieren en d&oacute;nde viven las acciones del rengl&oacute;n.<br><br>Pero un filtro de tres chips no tiene c&oacute;mo volver al cat&aacute;logo completo. <b>Izquierda:</b> <code>1f</code> tal cual &mdash; tres chips, uno siempre activo, <b>3 de 9 platillos</b> en pantalla y ninguna forma de ver los nueve. <b>Derecha:</b> un cuarto chip <code>Todos 9</code>, activo por defecto, para que el cat&aacute;logo abra completo y los cursos lo acoten.<br><br>La versi&oacute;n de la derecha cuesta un chip m&aacute;s en el rengl&oacute;n m&aacute;s apretado de la app &mdash; y en espa&ntilde;ol esos chips llevan <code>Guarniciones</code>. Toca <b>ES</b> y comprueba que siga cabiendo.'],

  boardh:['The selected board','El board seleccionado'],
  boardsub:['<b>A and D are the live choice</b> &mdash; both filter, and differ only in where a row&rsquo;s actions live. B and C are kept below for the record; they group, which is now ruled out.',
            '<b>A y D son la elecci&oacute;n viva</b> &mdash; los dos filtran, y s&oacute;lo difieren en d&oacute;nde viven las acciones del rengl&oacute;n. B y C se conservan abajo como registro; agrupan, que ya qued&oacute; descartado.'],
  ruledOut:['RULED OUT &mdash; this board groups, and grouping lost.',
            'DESCARTADO &mdash; este board agrupa, y agrupar qued&oacute; fuera.'],

  sheeth:['The add / edit form','La hoja de agregar / editar'],
  sheetdecided:['<b>Settled.</b> <b>S2</b> &mdash; a Sheet rising from the bottom on the phone, a centred panel on the desktop. And the selected course segment is <b>dark, not green</b>: the catalogue is dark territory, and a course is not the weekly plan. Both are drawn that way here.<br><br>Still open, and independent of the board you pick: <code>1g</code> draws <span style="color:#8a2323">used 3&times; in the last 8 weeks</span>, which the app has no way to compute. Under the map&rsquo;s <i>New features</i> rule that looks like it should be dropped.',
                '<b>Decidido.</b> <b>S2</b> &mdash; una hoja que sube desde abajo en el tel&eacute;fono, y un panel centrado en el escritorio. Y el segmento del curso seleccionado va en <b>oscuro, no en verde</b>: el cat&aacute;logo es territorio oscuro, y un curso no es el plan semanal. As&iacute; est&aacute;n dibujados aqu&iacute;.<br><br>Sigue abierto, e independiente del board que elijas: <code>1g</code> dibuja <span style="color:#8a2323">usado 3&times; en las &uacute;ltimas 8 semanas</span>, que la app no puede calcular. Bajo la regla de <i>New features</i> del mapa, parece que debe eliminarse.'],

  filterLbl:['Three chips &mdash; <code>1f</code> exactly','Tres chips &mdash; <code>1f</code> tal cual'],
  groupLbl:['Four chips &mdash; with All','Cuatro chips &mdash; con Todos'],
  catalogue:['Catalogue','Cat&aacute;logo'],
  opens:['&middot;&middot;&middot; opens','&middot;&middot;&middot; abre'],
  rowOpens:['the row opens','el rengl&oacute;n abre'],
  offscreen:['The desktop is the same filtered list, one column wider. The three columns are gone: a filter and a by-course grid cannot both exist, and the filter won.',
             'El escritorio es la misma lista filtrada, una columna m&aacute;s ancha. Las tres columnas desaparecen: un filtro y una cuadr&iacute;cula por curso no pueden coexistir, y gan&oacute; el filtro.'],
  cannot:['the app cannot compute this','la app no puede calcular esto'],
  dimmed:['dishes &middot; dimmed','platillos &middot; atenuado'],
  phoneW:['Phone &mdash; 390px','Tel&eacute;fono &mdash; 390px'],
  deskW:['Desktop &mdash; 900px','Escritorio &mdash; 900px']
};
const x = k => X[k][L];

/* Dish names are never translated (ADR-0001). */
const DISHES = {
  soup:[['Sopa de fideo','by'],['Caldo de pollo','by2'],['Sopa de tortilla','by3']],
  side:[['Arroz rojo','by2'],['Ensalada de nopales','by'],['Frijoles charros','by3']],
  main:[['Alb&oacute;ndigas en chipotle','by2'],['Cochinita pibil','by'],['Mole de olla','by3']]
};
const COURSES = ['soup','side','main'];
const PLURAL = {soup:'soups', side:'sides', main:'mains'};

function itemInner(name, byKey){
  return '<div class="item-main"><div class="t-dish">' + name +
    '</div><div class="t-meta-sm" style="margin-top:3px">' + t(byKey) + '</div></div>';
}
function item(name, byKey, action){
  const a = action === 'dots' ? '<button class="dots">&middot;&middot;&middot;</button>'
          : action === 'edit' ? '<button class="rowlink">' + t('edit') + '</button>' : '';
  return '<div class="item">' + itemInner(name, byKey) + a + '</div>';
}
function itemTap(name, byKey){
  return '<button class="item-tap"><span class="item" style="border:none">' + itemInner(name, byKey) +
    '<span class="chev">&rsaquo;</span></span></button>';
}
function head(wide){
  return '<div class="' + (wide ? 'hdr-d' : 'hdr') + '"><div><div class="' + (wide ? 't-title-d' : 't-title') + '">' +
    t('dishes') + '</div><div class="t-meta" style="margin-top:4px">' + t('total') +
    '</div></div><button class="btn btn-dark">' + t('addDish') + '</button></div>';
}
function filterChips(style, withAll){
  const all = withAll ? '<button class="chip on">' + t('all') + ' 9</button>' : '';
  const first = withAll ? '<button class="chip">' : '<button class="chip on">';
  return '<div class="chips"' + (style ? ' style="' + style + '"' : '') + '>' + all + first +
    t('soups') + ' 3</button><button class="chip">' + t('sides') + ' 3</button><button class="chip">' +
    t('mains') + ' 3</button></div>';
}
function groupHead(c){
  return '<div class="ghead"><span class="t-eyebrow">' + t(PLURAL[c]) + ' &middot; 3</span>' +
    '<button class="gadd">' + t('add') + '</button></div>';
}
function tabbar(){
  return '<div class="tabbar"><div class="t-tab">' + t('plan') + '</div><div class="t-tab on">' + t('dishes') +
    '</div><div class="t-tab">' + t('history') + '</div><div class="t-tab">' + t('more') + '</div></div>';
}
/* When the All chip is the active one, every course is on screen at once. */
function shown(withAll){
  return withAll ? COURSES.reduce((a, c) => a.concat(DISHES[c]), []) : DISHES.soup;
}
function phone(b, withAll){
  let body;
  if (b === 'A')      body = filterChips(null, withAll) + '<div class="list">' + shown(withAll).map(d => item(d[0],d[1],'dots')).join('') + '</div>';
  else if (b === 'B') body = COURSES.map(c => groupHead(c) + '<div class="list">' + DISHES[c].map(d => item(d[0],d[1],'dots')).join('') + '</div>').join('');
  else if (b === 'C') body = COURSES.map(c => groupHead(c) + '<div class="list">' + DISHES[c].map(d => item(d[0],d[1],'edit')).join('') + '</div>').join('');
  else                body = filterChips(null, withAll) + '<div class="list">' + shown(withAll).map(d => itemTap(d[0],d[1])).join('') + '</div>';
  return '<div class="frame">' + head(false) + '<div style="padding-bottom:16px">' + body + '</div>' + tabbar() + '</div>';
}
function actionSheet(){
  return '<div class="frame"><div style="flex:1;background:var(--scrim)"><div class="dim">' + x('dimmed') +
    '</div></div><div class="sheet actionsheet" style="gap:0"><div class="sheet-hd" style="margin-bottom:8px">' +
    '<span class="t-title-sheet">Sopa de fideo</span><button class="dismiss">' + t('cancel') + '</button></div>' +
    '<div class="arow">' + t('edit') + '</div><div class="arow danger">' + t('del') + '</div></div></div>';
}
function gcol(c, action){
  const rows = action === 'tap' ? DISHES[c].map(d => itemTap(d[0],d[1])).join('')
                                : DISHES[c].map(d => item(d[0],d[1],action)).join('');
  return '<div class="gcol"><div class="gcol-head"><span class="t-eyebrow">' + t(PLURAL[c]) +
    '</span><span class="t-meta-sm">3</span></div>' + rows +
    '<div style="padding:11px 14px;border-top:1px solid var(--rule-inset)"><button class="gadd">' + t('add') + '</button></div></div>';
}
function desktop(b){
  let body;
  if (b === 'A' || b === 'D'){
    const rows = b === 'A' ? DISHES.soup.map(d => item(d[0],d[1],'dots')).join('')
                           : DISHES.soup.map(d => itemTap(d[0],d[1])).join('');
    body = '<div style="padding:18px 30px 0">' + filterChips('padding:0') + '</div>' +
      '<div style="padding:0 30px 24px"><div class="list" style="border:1px solid var(--rule);border-radius:var(--radius-card)">' +
      rows + '</div><div class="t-meta" style="margin-top:12px;max-width:62ch">' + x('offscreen') + '</div></div>';
  } else {
    body = '<div class="grid3">' + COURSES.map(c => gcol(c, b === 'B' ? 'dots' : 'edit')).join('') + '</div>';
  }
  return '<div class="dwrap"><div class="dframe"><div class="sidebar"><div class="brand">Food Organizer<span>casa lopez</span></div>' +
    '<div><div class="navitem">' + t('thisWeek') + '</div><div class="navitem on">' + t('dishes') + ' &middot; 9</div>' +
    '<div class="navitem">' + t('history') + '</div><div class="navitem">' + t('accounts') + '</div></div>' +
    '<div style="margin-top:auto;font:400 11px/1.6 \'IBM Plex Mono\',monospace;color:var(--ink-on-inverse-faint)">' +
    t('signedIn') + '<br><span style="color:rgba(255,254,251,.75)">mariana</span> &middot; member</div></div>' +
    '<div style="flex:1;min-width:0;display:flex;flex-direction:column">' + head(true) + body + '</div></div></div>';
}
function sheetGuts(){
  return '<div class="sheet-hd"><span class="t-title-sheet">' + t('editDish') + '</span>' +
    '<button class="dismiss">' + t('cancel') + '</button></div>' +
    '<div><div class="field-lbl">' + t('name') + '</div><div class="field">Alb&oacute;ndigas en chipotle</div>' +
    '<div class="help">' + t('noTrans') + '</div></div>' +
    '<div><div class="field-lbl">' + t('course') + '</div><div class="seg"><div>' + t('soup') + '</div><div>' +
    t('side') + '</div><div class="on">' + t('main') + '</div></div></div>' +
    '<div class="sheetmeta">' + t('meta1') + '<br><span class="absent">' + t('meta2') + ' &nbsp;&larr; ' + x('cannot') + '</span></div>' +
    '<div class="actions"><button class="btn btn-dark btn-block">' + t('save') + '</button>' +
    '<button class="btn-danger-outline">' + t('del') + '</button></div>';
}
function sheetPhone(){
  return '<div class="frame"><div style="flex:1;background:var(--scrim)"><div class="dim">' + x('dimmed') +
    '</div></div><div class="sheet">' + sheetGuts() + '</div></div>';
}
function sheetPanel(){
  return '<div class="dwrap"><div class="dframe" style="background:var(--scrim);align-items:center;justify-content:center;padding:40px 0">' +
    '<div class="panel">' + sheetGuts() + '</div></div></div>';
}

const BOARDS = {
  A:{name:['A &mdash; Filter chips over one list','A &mdash; Chips que filtran sobre una lista'],
     blurb:['<code>1f</code> taken literally. The chips are a switch; one course on screen at a time. Each row has <code>&middot;&middot;&middot;</code>, which opens a small sheet with Edit and Delete. <code>+ Add dish</code> does not know the course, so the sheet has to ask for it.',
            '<code>1f</code> al pie de la letra. Los chips son un interruptor; un curso en pantalla a la vez. Cada rengl&oacute;n tiene <code>&middot;&middot;&middot;</code>, que abre una hoja peque&ntilde;a con Editar y Eliminar. <code>+ Agregar platillo</code> no sabe el curso, as&iacute; que la hoja tiene que preguntarlo.'],
     cost:['The <code>&middot;&middot;&middot;</code> is a small target beside a large row, and it is the only thing on the row that does anything.',
           'El <code>&middot;&middot;&middot;</code> es un blanco peque&ntilde;o al lado de un rengl&oacute;n grande, y es lo &uacute;nico del rengl&oacute;n que hace algo.']},
  B:{name:['B &mdash; Grouped list, <code>&middot;&middot;&middot;</code> per row','B &mdash; Lista agrupada, <code>&middot;&middot;&middot;</code> por rengl&oacute;n'],
     blurb:['No chips. The three courses are headings in one list, each with its own count and its own <code>+ Add</code> &mdash; so the course is known before the form opens, the way the app works today. The row action is still <code>&middot;&middot;&middot;</code>.',
            'Sin chips. Los tres cursos son encabezados dentro de una lista, cada uno con su cuenta y su <code>+ Agregar</code> &mdash; as&iacute; el curso se sabe antes de abrir el formulario, como funciona la app hoy. La acci&oacute;n del rengl&oacute;n sigue siendo <code>&middot;&middot;&middot;</code>.'],
     cost:['COST: a long catalogue is a long scroll with no way to jump to a course.',
           'COSTO: un cat&aacute;logo largo es un scroll largo, sin manera de saltar a un curso.']},
  C:{name:['C &mdash; Grouped, and no <code>&middot;&middot;&middot;</code> at all','C &mdash; Agrupado, y sin <code>&middot;&middot;&middot;</code>'],
     blurb:['Grouped like B, but the row shows <b>Edit</b> directly &mdash; no glyph, no extra sheet. <b>Delete lives only inside the edit form</b>, where <code>1g</code> already draws it. One tap less, and the destructive action sits further from a mis-tap.',
            'Agrupado como B, pero el rengl&oacute;n muestra <b>Editar</b> directamente &mdash; sin glifo, sin hoja extra. <b>Eliminar vive s&oacute;lo dentro del formulario</b>, donde <code>1g</code> ya lo dibuja. Un toque menos, y la acci&oacute;n destructiva queda m&aacute;s lejos de un toque accidental.'],
     cost:['COST: contradicts <code>1f</code>&rsquo;s glyph, for which #63 has already specified a colour.',
           'COSTO: contradice el glifo de <code>1f</code>, para el cual #63 ya especific&oacute; un color.']},
  D:{name:['D &mdash; Filter chips, and the row itself is the button','D &mdash; Chips que filtran, y el rengl&oacute;n mismo es el bot&oacute;n'],
     blurb:['Filters like A, but there is nothing on the right except a chevron: you tap anywhere on the row and the form opens, holding both Save and Delete. The least on screen of the four, and the biggest touch target.',
            'Filtra como A, pero no hay nada a la derecha salvo un chevron: tocas cualquier parte del rengl&oacute;n y se abre el formulario, con Guardar y Eliminar dentro. Lo m&aacute;s despejado de los cuatro, y el blanco t&aacute;ctil m&aacute;s grande.'],
     cost:['COST: reopens #65, which ruled the catalogue row is a surface that CONTAINS a control, not a control itself.',
           'COSTO: reabre #65, que decidi&oacute; que el rengl&oacute;n del cat&aacute;logo es una superficie que CONTIENE un control, no un control.']}
};

function render(){
  ['lblLang','lblBoard','lblWidth','h1','intro1','intro2','cmph','cmpsub','cmpnote','boardh','boardsub','sheeth','sheetdecided']
    .forEach(id => { document.getElementById(id).innerHTML = x(id); });
  document.getElementById('wPhone').innerHTML = x('wPhone');
  document.getElementById('wDesk').innerHTML = x('wDesk');

  document.getElementById('compare').innerHTML =
    '<div><div class="state">' + x('filterLbl') + '</div>' + phone('A', false) + '</div>' +
    '<div><div class="state">' + x('groupLbl') + '</div>' + phone('A', true) + '</div>';

  const b = BOARDS[BOARD];
  const out = (BOARD === 'B' || BOARD === 'C')
    ? '<span class="cost" style="margin:0 0 8px;display:block;font-weight:600">' + x('ruledOut') + '</span>' : '';
  document.getElementById('boardlabel').innerHTML =
    out + '<span class="bname">' + b.name[L] + '</span>' + b.blurb[L] +
    '<span class="cost">' + b.cost[L] + '</span>';

  if (WIDTH === 'phone'){
    const extra = (BOARD === 'A' || BOARD === 'B')
      ? '<div><div class="state">' + x('opens') + '</div>' + actionSheet() + '</div>'
      : (BOARD === 'D' ? '<div><div class="state">' + x('rowOpens') + '</div>' + sheetPhone() + '</div>' : '');
    document.getElementById('board').innerHTML =
      '<div><div class="state">' + x('catalogue') + '</div>' + phone(BOARD) + '</div>' + extra;
  } else {
    document.getElementById('board').innerHTML =
      '<div style="width:100%"><div class="state">' + x('deskW') + '</div>' + desktop(BOARD) + '</div>';
  }

  document.getElementById('sheets').innerHTML =
    '<div><div class="state">' + x('phoneW') + '</div>' + sheetPhone() + '</div>' +
    '<div style="width:100%"><div class="state">' + x('deskW') + '</div>' + sheetPanel() + '</div>';
}

document.querySelectorAll('.bar button').forEach(btn => btn.addEventListener('click', () => {
  const group = btn.dataset.lang ? 'lang' : btn.dataset.board ? 'board' : 'width';
  document.querySelectorAll('.bar button').forEach(o => {
    if ((group === 'lang' && o.dataset.lang) || (group === 'board' && o.dataset.board) ||
        (group === 'width' && o.dataset.width)) o.classList.remove('on');
  });
  btn.classList.add('on');
  if (group === 'lang')  L = btn.dataset.lang === 'es' ? 1 : 0;
  if (group === 'board') BOARD = btn.dataset.board;
  if (group === 'width') WIDTH = btn.dataset.width;
  render();
}));
render();
</script>
